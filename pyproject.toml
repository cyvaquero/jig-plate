[project]
name = "jig-plate"
version = "3.0.5"
description = "Parametric 3D-printable stackable laser jig base plate, magnets + stacking ribs/grooves"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "trimesh",
    "manifold3d",
    "shapely",
    "matplotlib",
    "pytest",
    "rtree",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
