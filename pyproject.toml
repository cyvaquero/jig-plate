[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jig-plate"
version = "3.0.16"
description = "Parametric 3D-printable stackable laser jig base plate, magnets + stacking ribs/grooves"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "trimesh",
    "manifold3d",
    "shapely",
    "matplotlib",
]

[project.optional-dependencies]
test = [
    "pytest",
    "rtree",
]

[tool.setuptools]
# Flat layout: only the library is a module. jig-plate.py is a hyphenated
# script, not importable; output/ and images/ are generated folders.
py-modules = ["jig_plate_base"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
